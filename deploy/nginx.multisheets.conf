# Multisheets - nginx site config
#
# WHY THIS FILE EXISTS
# The in-app blocklist in lib/security.ts only guards honeypot paths, and the
# in-app rate limiter in app/api/search/route.ts trusts X-Forwarded-For. Both
# are spoofable if a client hits Node directly. This config makes the edge the
# enforcing layer, which is the only place the real client IP ($remote_addr)
# is guaranteed.
#
# DEPLOY
#   1. scp this file to the Hostinger VPS as /etc/nginx/sites-available/multisheets
#   2. ln -s /etc/nginx/sites-available/multisheets /etc/nginx/sites-enabled/multisheets
#   3. nginx -t && systemctl reload nginx
#
# NOTE: 4th Oct 2026 Indian postal tariffs changed. The calculator and the
# Speed Post article must be updated before they are published. See
# app/blog/speed-post-vs-regular-post and app/tools/speed-post.

# ---- Connection / request limits -------------------------------------------
# Reject absurd request bodies and slowloris before they reach Node.
client_max_body_size 2m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_status 429;

upstream multisheets_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name multisheets.com www.multisheets.com;

    # ACME challenges must stay on plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://multisheets.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name multisheets.com;

    ssl_certificate     /etc/letsencrypt/live/multisheets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multisheets.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- Static assets: cache hard, never re-run Node ----------------------
    location /_next/static/ {
        proxy_pass http://multisheets_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/icon-.*\.svg$ {
        proxy_pass http://multisheets_node;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- Hard block: scanners probing for secrets --------------------------
    # Returns 404 rather than 403 so a scanner learns nothing about the rule.
    location ~* ^/(\.env|\.git|\.svn|\.hg|\.DS_Store|composer\.(json|lock)|vendor/|node_modules/) {
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~* \.(sql|sqlite|sqlite3|bak|old|orig|save|swp|log|env|ini|yml|yaml|conf|pem|key|p12|pfx)$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # ---- Rate limited API --------------------------------------------------
    location /api/search {
        limit_req zone=search_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://multisheets_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append: a client cannot spoof the value the
        # app reads when it sees exactly one entry in this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://multisheets_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- Everything else ---------------------------------------------------
    location / {
        proxy_pass http://multisheets_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
